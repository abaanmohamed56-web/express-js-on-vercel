<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Skill Pips member dashboard.">
  <title>Member Login — Skill Pips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── NAVBAR ── -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-content">
        <a href="index.html" class="logo">
          <svg class="logo-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="5" y="14" width="4" height="12" rx="1" fill="currentColor" opacity="0.4"/>
            <rect x="5" y="10" width="4" height="6" rx="1" fill="currentColor"/>
            <rect x="14" y="6" width="4" height="18" rx="1" fill="currentColor" opacity="0.4"/>
            <rect x="14" y="2" width="4" height="8" rx="1" fill="currentColor"/>
            <rect x="23" y="10" width="4" height="14" rx="1" fill="currentColor" opacity="0.4"/>
            <rect x="23" y="18" width="4" height="6" rx="1" fill="#00FF88"/>
          </svg>
          <span class="logo-text">SKILL PIPS</span>
        </a>

        <div class="nav-links" id="navLinks">
          <a href="index.html">Home</a>
          <a href="pricing.html">Pricing</a>
          <a href="pricing.html" class="btn-nav-cta">Join VIP</a>
        </div>

        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      </div>
    </div>
  </nav>

  <!-- ── LOGIN SECTION (full screen with chart bg) ── -->
  <section class="login-page-section">
    <!-- Chart background -->
    <div id="chart-bg"></div>
    <!-- Darker overlay for readability -->
    <div class="hero-overlay"></div>

    <!-- Login card centered -->
    <div class="login-wrap container">
      <div class="login-card">

        <div class="login-header">
          <!-- Lock icon -->
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 16px;display:block" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <h1>Welcome Back</h1>
          <p>Access your member dashboard</p>
        </div>

        <form id="loginForm" class="login-form" novalidate>
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" name="email" placeholder="your@email.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" name="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-password" id="forgotPasswordLink">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary btn-login" id="loginBtn">
            <span id="loginButtonText">Sign In</span>
            <span id="loginSpinner" class="spinner" style="display:none;" aria-hidden="true"></span>
          </button>

          <div id="loginError" class="error-message" role="alert"></div>
        </form>

        <div class="login-footer">
          <p>Don't have an account? <a href="pricing.html">Join Now</a></p>
        </div>

      </div>
    </div>
  </section>

  <!-- ── FORGOT PASSWORD MODAL ── -->
  <div id="forgotPasswordModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">Reset Password</h2>
        <button class="modal-close" id="modalCloseBtn" aria-label="Close modal">&times;</button>
      </div>

      <form id="forgotPasswordForm" novalidate>
        <div class="form-group">
          <label for="resetEmail">Email Address</label>
          <input type="email" id="resetEmail" name="email" placeholder="your@email.com" required>
          <small>We'll send you a password reset link</small>
        </div>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send Reset Link
        </button>
      </form>

      <div id="resetSuccess" class="success-message" role="status" style="margin-top:16px;">
        Check your email for the reset link!
      </div>
    </div>
  </div>

  <!-- ── FOOTER ── -->
  <footer class="footer" style="position:relative;z-index:2;">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2025 Skill Pips. All rights reserved.</p>
        <p class="disclaimer-text">Need help? Email <a href="mailto:support@skillpips.com" style="color:var(--accent)">support@skillpips.com</a></p>
      </div>
    </div>
  </footer>

  <!-- ── LOGIN JS ── -->
  <script>
    // Mobile nav
    (function () {
      const btn = document.getElementById('mobileMenuBtn');
      const nav = document.getElementById('navLinks');
      if (btn && nav) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const open = nav.classList.toggle('active');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
        document.addEventListener('click', function (e) {
          if (nav.classList.contains('active') && !nav.contains(e.target) && e.target !== btn) {
            nav.classList.remove('active');
            btn.setAttribute('aria-expanded', 'false');
          }
        });
      }
    })();

    // Login form
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const btn        = document.getElementById('loginBtn');
      const btnText    = document.getElementById('loginButtonText');
      const spinner    = document.getElementById('loginSpinner');
      const errorDiv   = document.getElementById('loginError');

      btn.disabled          = true;
      btnText.textContent   = 'Signing in...';
      spinner.style.display = 'inline-block';
      errorDiv.style.display = 'none';

      const email      = document.getElementById('loginEmail').value.trim();
      const password   = document.getElementById('loginPassword').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      try {
        const response = await fetch('/api/auth/login', {
          method:      'POST',
          credentials: 'include',
          headers:     { 'Content-Type': 'application/json' },
          body:        JSON.stringify({ email, password, rememberMe }),
        });

        const data = await response.json().catch(function () { return {}; });

        if (response.ok) {
          window.location.href = 'dashboard.html';
        } else {
          errorDiv.textContent    = data.error || 'Invalid email or password. Please try again.';
          errorDiv.style.display  = 'block';
          btn.disabled            = false;
          btnText.textContent     = 'Sign In';
          spinner.style.display   = 'none';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorDiv.textContent    = 'Network error. Please check your connection and try again.';
        errorDiv.style.display  = 'block';
        btn.disabled            = false;
        btnText.textContent     = 'Sign In';
        spinner.style.display   = 'none';
      }
    });

    // Forgot password modal
    document.getElementById('forgotPasswordLink').addEventListener('click', function (e) {
      e.preventDefault();
      openModal();
    });

    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);

    document.getElementById('forgotPasswordModal').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });

    function openModal() {
      const m = document.getElementById('forgotPasswordModal');
      m.classList.add('is-open');
      m.style.display = 'flex';
      document.getElementById('resetEmail').focus();
    }

    function closeModal() {
      const m = document.getElementById('forgotPasswordModal');
      m.classList.remove('is-open');
      m.style.display = 'none';
      document.getElementById('resetSuccess').style.display = 'none';
      document.getElementById('forgotPasswordForm').style.display = 'block';
      document.getElementById('forgotPasswordForm').reset();
    }

    document.getElementById('forgotPasswordForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      try {
        const response = await fetch('/api/auth/forgot-password', {
          method:      'POST',
          credentials: 'include',
          headers:     { 'Content-Type': 'application/json' },
          body:        JSON.stringify({ email }),
        });
        if (response.ok) {
          document.getElementById('forgotPasswordForm').style.display = 'none';
          const successEl = document.getElementById('resetSuccess');
          successEl.style.display = 'block';
        } else {
          alert('Failed to send reset link. Please try again.');
        }
      } catch (err) {
        console.error('Forgot password error:', err);
        alert('Network error. Please try again.');
      }
    });
  </script>

  <!-- TradingView Lightweight Charts — same animated candlestick as hero -->
  <script>
    (function () {
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js';
      script.onload = function () {
        const el = document.getElementById('chart-bg');
        if (!el) return;
        const chart = LightweightCharts.createChart(el, {
          width: el.offsetWidth,
          height: el.offsetHeight,
          layout: { background: { color: 'transparent' }, textColor: 'rgba(255,255,255,0)' },
          grid: { vertLines: { color: 'rgba(255,255,255,0.03)' }, horzLines: { color: 'rgba(255,255,255,0.03)' } },
          crosshair: { mode: 0 },
          rightPriceScale: { visible: false },
          timeScale: { visible: false },
          handleScroll: false,
          handleScale: false,
        });
        const series = chart.addCandlestickSeries({
          upColor: '#00FF88', downColor: '#FF4D6D',
          borderUpColor: '#00FF88', borderDownColor: '#FF4D6D',
          wickUpColor: '#00FF8866', wickDownColor: '#FF4D6D66',
        });

        const candles = [];
        let price = 1.08450;
        const now = Math.floor(Date.now() / 1000);
        for (let i = 119; i >= 0; i--) {
          const open = price;
          const change = (Math.random() - 0.48) * 0.00120;
          const close = open + change;
          const high = Math.max(open, close) + Math.random() * 0.00060;
          const low  = Math.min(open, close) - Math.random() * 0.00060;
          candles.push({ time: now - i * 60, open, high, low, close: parseFloat(close.toFixed(5)) });
          price = close;
        }
        series.setData(candles);
        chart.timeScale().fitContent();

        let last = candles[candles.length - 1];
        setInterval(function () {
          const open = last.close;
          const change = (Math.random() - 0.48) * 0.00120;
          const close = parseFloat((open + change).toFixed(5));
          const high  = Math.max(open, close) + Math.random() * 0.00060;
          const low   = Math.min(open, close) - Math.random() * 0.00060;
          last = { time: last.time + 60, open, high, low, close };
          series.update(last);
        }, 2000);

        window.addEventListener('resize', function () {
          chart.applyOptions({ width: el.offsetWidth, height: el.offsetHeight });
        });
      };
      document.head.appendChild(script);
    })();
  </script>

</body>
</html>
